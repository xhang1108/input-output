<svg width="600" height="220" viewBox="0 0 600 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .row-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #a1a1aa; }
    .key-bg { fill: #18181b; stroke: #3f3f46; stroke-width: 1.5; }
    .key-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-transform: uppercase; }
    .key-desc { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #e4e4e7; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>

  <g transform="translate(10, 0)">
    <g transform="translate(0, 0)">
      <rect width="50" height="50" rx="8" class="key-bg" />
      <text x="25" y="22" text-anchor="middle" class="key-text">A</text>
      <text x="25" y="40" text-anchor="middle" class="key-desc">All</text>
      <g transform="translate(60, 0)">
        <rect width="50" height="50" rx="8" class="key-bg" />
        <text x="25" y="22" text-anchor="middle" class="key-text">N</text>
        <text x="25" y="40" text-anchor="middle" class="key-desc">Prop</text>
      </g>
      <g transform="translate(120, 0)">
        <rect width="50" height="50" rx="8" class="key-bg" />
        <text x="25" y="22" text-anchor="middle" class="key-text">L</text>
        <text x="25" y="40" text-anchor="middle" class="key-desc">Layout</text>
      </g>
      <g transform="translate(180, 0)">
        <rect width="50" height="50" rx="8" class="key-bg" />
        <text x="25" y="22" text-anchor="middle" class="key-text">F</text>
        <text x="25" y="40" text-anchor="middle" class="key-desc">Frame</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="50" height="50" rx="8" class="key-bg" />
        <text x="25" y="22" text-anchor="middle" class="key-text">M</text>
        <text x="25" y="40" text-anchor="middle" class="key-desc">Mute</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="70" height="50" rx="8" class="key-bg" />
        <text x="35" y="22" text-anchor="middle" class="key-text">ESC</text>
        <text x="35" y="40" text-anchor="middle" class="key-desc">Cancel</text>
      </g>
    </g>
    <g transform="translate(0, 75)" class="row-desc">
      <text y="0">A: Select all nodes in active session.</text>
      <text y="20">N: Open properties panel for current selection.</text>
      <text y="40">L: Trigger automatic topological layout.</text>
      <text y="60">F: Frame active selection for organization.</text>
      <text y="80">M: Bypass current node in the calculation path.</text>
      <text y="100">ESC: Deselect or cancel current operation.</text>
    </g>
  </g>
</svg>
