<svg width="800" height="700" viewBox="0 0 800 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-scalar" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-matrix" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-string" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-boolean" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-symbolic" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-unit" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-color" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="glow-any" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>

  <style>
    .type-title { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
    .type-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #e4e4e7; }
    .type-example { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #71717a; }
    .port-bg { fill: #121212; stroke-width: 2.5; }
    .divider { stroke: #3f3f46; stroke-width: 1; opacity: 0.2; }
  </style>

  <g transform="translate(40, 10)">
    <!-- SCALAR -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#737373" filter="url(#glow-scalar)" />
      <circle cx="20" cy="20" r="4.5" fill="#737373" />
      <text x="50" y="15" class="type-title" fill="#a3a3a3">Scalar</text>
      <text x="50" y="32" class="type-desc">Real numbers and constants</text>
      <text x="350" y="24" class="type-example">3.14159, -42, 1e-10</text>
    </g>
    <path d="M0 65 H720" class="divider" />

    <!-- MATRIX -->
    <g transform="translate(0, 85)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#a78bfa" filter="url(#glow-matrix)" />
      <circle cx="20" cy="20" r="4.5" fill="#a78bfa" />
      <text x="50" y="15" class="type-title" fill="#c4b5fd">Matrix / Array</text>
      <text x="50" y="32" class="type-desc">Vectors, Matrices, and Tensors</text>
      <text x="350" y="24" class="type-example">[[1, 0, 0], [0, 1, 0]], [x, y, z]</text>
    </g>
    <path d="M0 150 H720" class="divider" />

    <!-- STRING -->
    <g transform="translate(0, 170)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#7dd3fc" filter="url(#glow-string)" />
      <circle cx="20" cy="20" r="4.5" fill="#7dd3fc" />
      <text x="50" y="15" class="type-title" fill="#bae6fd">String</text>
      <text x="50" y="32" class="type-desc">Text labels and identifiers</text>
      <text x="350" y="24" class="type-example">"radius", "engine_v1", "active"</text>
    </g>
    <path d="M0 235 H720" class="divider" />

    <!-- BOOLEAN -->
    <g transform="translate(0, 255)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#f9a8d4" filter="url(#glow-boolean)" />
      <circle cx="20" cy="20" r="4.5" fill="#f9a8d4" />
      <text x="50" y="15" class="type-title" fill="#fbcfe8">Boolean</text>
      <text x="50" y="32" class="type-desc">Logical state binary values</text>
      <text x="350" y="24" class="type-example">true, false</text>
    </g>
    <path d="M0 320 H720" class="divider" />

    <!-- SYMBOLIC -->
    <g transform="translate(0, 340)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#fb8c00" filter="url(#glow-symbolic)" />
      <circle cx="20" cy="20" r="4.5" fill="#fb8c00" />
      <text x="50" y="15" class="type-title" fill="#ffa726">Symbolic / Logic</text>
      <text x="50" y="32" class="type-desc">Algebraic expressions and AST</text>
      <text x="350" y="24" class="type-example">f(x) = sin(x) * 2, x + y</text>
    </g>
    <path d="M0 405 H720" class="divider" />

    <!-- UNIT -->
    <g transform="translate(0, 425)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#06b6d4" filter="url(#glow-unit)" />
      <circle cx="20" cy="20" r="4.5" fill="#06b6d4" />
      <text x="50" y="15" class="type-title" fill="#22d3ee">Unit</text>
      <text x="50" y="32" class="type-desc">SI units and physical measurements</text>
      <text x="350" y="24" class="type-example">5kg, 300m/s, 9.8m/s^2</text>
    </g>
    <path d="M0 490 H720" class="divider" />

    <!-- COLOR -->
    <g transform="translate(0, 510)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#eab308" filter="url(#glow-color)" />
      <circle cx="20" cy="20" r="4.5" fill="#eab308" />
      <text x="50" y="15" class="type-title" fill="#fde047">Color</text>
      <text x="50" y="32" class="type-desc">Visual color data and visualizers</text>
      <text x="350" y="24" class="type-example">#FF0000, hsl(0, 100%, 50%)</text>
    </g>
    <path d="M0 575 H720" class="divider" />

    <!-- ANY -->
    <g transform="translate(0, 595)">
      <circle cx="20" cy="20" r="12" class="port-bg" stroke="#ffffff" filter="url(#glow-any)" />
      <circle cx="20" cy="20" r="4.5" fill="#ffffff" />
      <text x="50" y="15" class="type-title" fill="#ffffff">Any</text>
      <text x="50" y="32" class="type-desc">Universal / Undetermined slots</text>
      <text x="350" y="24" class="type-example">dynamic_payload, object{...}</text>
    </g>
  </g>
</svg>
