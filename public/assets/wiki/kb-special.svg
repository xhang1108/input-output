<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .row-desc { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; fill: #a1a1aa; font-style: italic; }
    .key-bg { fill: #18181b; stroke: #3f3f46; stroke-width: 1.5; }
    .key-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; text-transform: uppercase; }
    .key-desc { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #e4e4e7; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>

  <g transform="translate(10, 0)">
    <g transform="translate(0, 0)">
      <rect width="100" height="50" rx="8" class="key-bg" />
      <text x="50" y="22" text-anchor="middle" class="key-text">SHIFT+A</text>
      <text x="50" y="40" text-anchor="middle" class="key-desc">Add</text>
      <g transform="translate(110, 0)">
        <rect width="100" height="50" rx="8" class="key-bg" />
        <text x="50" y="22" text-anchor="middle" class="key-text">SHIFT+D</text>
        <text x="50" y="40" text-anchor="middle" class="key-desc">Duplicate</text>
      </g>
      <g transform="translate(220, 0)">
        <rect width="80" height="50" rx="8" class="key-bg" />
        <text x="40" y="22" text-anchor="middle" class="key-text">ALT+S</text>
        <text x="40" y="40" text-anchor="middle" class="key-desc">Link Swap</text>
      </g>
    </g>
    <g transform="translate(0, 75)" class="row-desc">
      <text y="0">SHIFT+A: Open creation menu. SHIFT+D: Fast duplicate selection.</text>
      <text y="20">ALT+S: Cycle connections between stacked input handles.</text>
    </g>
  </g>
</svg>
